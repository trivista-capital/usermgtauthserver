version: "3.9"
services:
  trivista-user-management:
    build:
      context: .
      dockerfile: Trivister.API/Dockerfile
    image: user-management:latest
    container_name: trivista-user-management 
    restart: unless-stopped
    ports:
      - 8091:80
    networks:
      - trivista_capital
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

networks:
  trivista_capital:
    external: true
